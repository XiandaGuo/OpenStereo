MODEL:
    NAME: FastFoundationStereo
    corr_levels: 2
    corr_radius: 4
    hidden_dims: [128]
    low_memory: 0
    max_disp: 192
    mixed_precision: true
    n_downsample: 2
    n_gru_layers: 1
    slow_fast_gru: false
    train_iters: 12
    valid_iters: 8
    optimize_build_volume: pytorch1
    vit_size: vitl
    normalize: true
    # make sure to download pretrained weights from 
    # https://github.com/NVlabs/Fast-FoundationStereo/blob/master/readme.md#weights-and-trade-off
    fast_foundationstereo_path: /your_path/model_best_bp2_serialize.pth
    FIND_UNUSED_PARAMETERS: true
    CKPT: -1
    PRETRAINED_MODEL: ''

OPTIMIZATION:
    FREEZE_BN: false
    SYNC_BN: true
    AMP: false


TRAINER:
    EVAL_INTERVAL: 1
    CKPT_SAVE_INTERVAL: 1
    MAX_CKPT_SAVE_NUM: 30
    LOGGER_ITER_INTERVAL: 10
    TRAIN_VISUALIZATION: True
    EVAL_VISUALIZATION: True